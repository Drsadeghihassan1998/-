<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>برنامه‌ی تغذیه‌ی اسپارتینا</title>
<style>
@font-face { font-family: 'Vazirmatn'; src: url(data:font/woff2;base64,/*@@FONT@@*/) format('woff2'); font-weight: 100 900; font-display: swap; }
:root {
  --lapis: #1C2766; --lapis2: #2D3C9A; --plum: #5B2B83; --turq: #0E9F9A; --turq2: #14B8A6; --turqs: #E2F5F3;
  --saff: #F0A133; --saffs: #FFF2DC; --pome: #C7375A; --pomes: #FCE8ED; --cream: #FBF7EF; --paper: #FFFFFF;
  --ink: #191D3A; --muted: #696D8C; --line: #E7E2D6; --shadow: 0 6px 24px rgba(28, 39, 102, .08);
  --r: 16px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: 'Vazirmatn', Tahoma, sans-serif; background: var(--cream); color: var(--ink); font-size: 15px; line-height: 1.7; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
.num { font-feature-settings: 'ss01'; }

/* ---------- top bar ---------- */
.top { position: sticky; top: 0; z-index: 20; background: linear-gradient(115deg, var(--lapis), var(--plum)); color: #fff; box-shadow: 0 4px 20px rgba(28, 39, 102, .25); }
.top-in { max-width: 1280px; margin: auto; display: flex; align-items: center; gap: 14px; padding: 10px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand svg { width: 42px; height: 42px; }
.brand b { font-size: 17px; font-weight: 800; display: block; line-height: 1.3; }
.brand small { opacity: .8; font-size: 12px; }
.top .sp { flex: 1; }
.tbtn { background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .25); color: #fff; padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 13.5px; display: inline-flex; gap: 6px; align-items: center; transition: .15s; }
.tbtn:hover { background: rgba(255, 255, 255, .22); }
.tbtn.gold { background: var(--saff); border-color: var(--saff); color: var(--lapis); font-weight: 700; }

/* ---------- layout ---------- */
.wrap { max-width: 1280px; margin: auto; display: grid; grid-template-columns: 270px 1fr; gap: 22px; padding: 22px 20px 60px; }
@media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
.side { background: var(--paper); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; align-self: start; position: sticky; top: 86px; max-height: calc(100vh - 110px); overflow: auto; }
@media (max-width: 900px) { .side { position: static; max-height: none; } }
.side h3 { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 600; }
.search { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; margin-bottom: 10px; background: var(--cream); }
.pt { display: block; width: 100%; text-align: right; border: 0; background: transparent; padding: 9px 10px; border-radius: 10px; cursor: pointer; margin-bottom: 2px; }
.pt:hover { background: var(--turqs); }
.pt.on { background: linear-gradient(90deg, var(--turqs), #fff); box-shadow: inset -3px 0 0 var(--turq); }
.pt b { display: block; font-size: 14px; }
.pt small { color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); font-size: 13px; padding: 10px 4px; }

.main { min-width: 0; }
.steps { display: flex; gap: 6px; background: var(--paper); padding: 6px; border-radius: 999px; box-shadow: var(--shadow); margin-bottom: 18px; overflow-x: auto; }
.step { flex: 1; min-width: max-content; border: 0; background: transparent; padding: 9px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 8px; justify-content: center; }
.step i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--cream); font-size: 12px; }
.step.on { background: var(--lapis); color: #fff; }
.step.on i { background: var(--saff); color: var(--lapis); }
.step .opt { font-size: 10.5px; opacity: .7; font-weight: 400; }

.card { background: var(--paper); border-radius: var(--r); box-shadow: var(--shadow); padding: 22px; margin-bottom: 18px; }
.card h2 { margin: 0 0 4px; font-size: 19px; color: var(--lapis); }
.card .lead { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.fld label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
.fld input, .fld select, .fld textarea { width: 100%; border: 1.5px solid var(--line); background: var(--cream); border-radius: 12px; padding: 9px 12px; outline: none; transition: .15s; }
.fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--turq); background: #fff; box-shadow: 0 0 0 4px var(--turqs); }
.fld .u { font-size: 11.5px; color: var(--muted); }
.req::after { content: ' *'; color: var(--pome); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 13.5px; transition: .15s; user-select: none; }
.chip:hover { border-color: var(--turq); }
.chip.on { background: var(--turq); border-color: var(--turq); color: #fff; }
.chip.warn.on { background: var(--pome); border-color: var(--pome); }
.chip.ex { text-decoration: line-through; background: var(--pomes); border-color: #F1B9C6; color: var(--pome); }
.chip.big { padding: 12px 16px; border-radius: 14px; text-align: right; }
.chip.big b { display: block; }
.chip.big small { opacity: .8; font-size: 12px; }
.sub { font-size: 14px; font-weight: 700; color: var(--plum); margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
.sub::before { content: ''; width: 8px; height: 8px; border-radius: 2px; background: var(--saff); transform: rotate(45deg); }

.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; }
.btn { border: 0; border-radius: 12px; padding: 11px 22px; cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; transition: .15s; }
.btn.pri { background: linear-gradient(115deg, var(--lapis2), var(--plum)); color: #fff; box-shadow: 0 6px 18px rgba(45, 60, 154, .3); }
.btn.pri:hover { transform: translateY(-1px); }
.btn.gold { background: var(--saff); color: var(--lapis); }
.btn.ghost { background: var(--cream); color: var(--lapis); border: 1.5px solid var(--line); }
.btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 10px; }

/* ---------- results ---------- */
.alert { border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; font-size: 14px; display: flex; gap: 10px; }
.alert.red { background: var(--pomes); color: #8E1E3A; border: 1px solid #F3C2CE; }
.alert.gold { background: var(--saffs); color: #7A4D07; border: 1px solid #F6D9A5; }
.alert.teal { background: var(--turqs); color: #0B5E5B; border: 1px solid #BDE8E3; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.kpi { border-radius: 14px; padding: 14px; background: var(--cream); position: relative; overflow: hidden; }
.kpi b { font-size: 24px; display: block; font-weight: 800; line-height: 1.3; }
.kpi span { font-size: 12.5px; color: var(--muted); }
.kpi.c1 { background: linear-gradient(135deg, #E7EAFB, #fff); } .kpi.c1 b { color: var(--lapis2); }
.kpi.c2 { background: linear-gradient(135deg, #FCE8ED, #fff); } .kpi.c2 b { color: var(--pome); }
.kpi.c3 { background: linear-gradient(135deg, #FFF0D6, #fff); } .kpi.c3 b { color: #C47A0E; }
.kpi.c4 { background: linear-gradient(135deg, #EFE5F7, #fff); } .kpi.c4 b { color: var(--plum); }
.kpi.c5 { background: linear-gradient(135deg, #DDF4F2, #fff); } .kpi.c5 b { color: var(--turq); }
.kpi.c6 { background: linear-gradient(135deg, #E5F3FB, #fff); } .kpi.c6 b { color: #1E7FB8; }
.mini { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-top: 12px; }
.mini div { font-size: 12.5px; color: var(--muted); background: var(--cream); border-radius: 10px; padding: 8px 10px; }
.mini b { color: var(--ink); font-size: 14px; display: block; }
details.ovr { margin-top: 14px; background: var(--cream); border-radius: 12px; padding: 10px 14px; }
details.ovr summary { cursor: pointer; font-weight: 700; color: var(--lapis); font-size: 13.5px; }

.daytabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.daytab { border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 13.5px; }
.daytab.on { background: var(--lapis); border-color: var(--lapis); color: #fff; }
.meal { border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; background: #fff; }
.meal-h { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.meal-h .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-size: 16px; flex: none; }
.meal-h b { font-size: 14.5px; }
.meal-h small { color: var(--muted); display: block; font-size: 12px; }
.meal-h .k { margin-right: auto; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.items { display: flex; flex-wrap: wrap; gap: 6px; }
.it { border: 1.5px dashed #CFCAE0; background: var(--cream); border-radius: 10px; padding: 4px 8px; font-size: 13px; cursor: pointer; transition: .15s; display: inline-flex; align-items: center; gap: 6px; user-select: none; }
.it:hover { border-color: var(--turq); border-style: solid; background: var(--turqs); }
.it small { color: var(--muted); }
.it-txt { display: inline-flex; align-items: center; gap: 4px; }
.it-del { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; border: none; background: rgba(0,0,0,0.06); color: #8892B0; font-size: 11px; font-weight: 700; cursor: pointer; padding: 0; line-height: 1; transition: .15s; margin-inline-start: 4px; flex-shrink: 0; }
.it-del:hover { background: #FEE2E2; color: #DC2626; transform: scale(1.18); }
.meal-foot { margin-top: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
.btn-add-item { border: 1px dashed var(--turq); background: var(--turqs); color: var(--turq); border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 700; cursor: pointer; transition: .15s; display: inline-flex; align-items: center; gap: 4px; }
.btn-add-item:hover { background: #bcebe6; border-style: solid; transform: translateY(-1px); }
.mz-sec { margin: 22px 0 4px; font-size: 16px; color: var(--lapis, #1C2766); }
.mz-prog { font-size: 13px; color: var(--muted); margin: 6px 0 4px; }
.mz-prog .mg-b { margin-top: 6px; }
.mq3 { display: grid; grid-template-columns: 28px 1fr 290px 1fr; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.mzt { font-size: 13px; line-height: 1.7; padding: 6px 10px; border-radius: 12px; border: 1.5px solid transparent; }
.mzt.r.on { background: #E3F2FB; border-color: #1E7FB8; color: #0E4A6E; font-weight: 700; }
.mzt.l.on { background: #FCE8ED; border-color: #C7375A; color: #7E1A33; font-weight: 700; }
.mzs { display: flex; gap: 3px; justify-content: center; direction: rtl; }
.mzn { font: inherit; font-size: 12px; width: 24px; height: 30px; padding: 0; border-radius: 8px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; }
.mzn.r { border-color: #BFDDF0; } .mzn.l { border-color: #F2C6D2; } .mzn.m { border-color: var(--turq); font-weight: 700; }
.mzn:hover { background: var(--turqs); }
.mzs { flex-wrap: wrap; } .mzr { display: flex; gap: inherit; flex: 1 1 100%; justify-content: center; } .mzn.x { flex: 1 1 100%; width: auto; height: 24px; margin-top: 3px; font-size: 11px; color: var(--muted); } .mzn.x.on { background: #6B7280; border-color: #6B7280; color: #fff; }
.mzn.on.r { background: #1E7FB8; color: #fff; } .mzn.on.l { background: #C7375A; color: #fff; } .mzn.on.m { background: var(--turq); color: #fff; }
.mq3 > i { font-style: normal; font-weight: 800; color: var(--muted); align-self: center; text-align: center; font-size: 13px; }
.mzo { font: inherit; font-size: 13px; line-height: 1.7; text-align: right; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 7px 10px; cursor: pointer; transition: .12s; }
.mzo.m { text-align: center; color: var(--muted); font-size: 12px; }
.mzo:hover { border-color: var(--turq); }
.mzo.r.on { background: #E3F2FB; border-color: #1E7FB8; color: #0E4A6E; font-weight: 700; }
.mzo.l.on { background: #FCE8ED; border-color: #C7375A; color: #7E1A33; font-weight: 700; }
.mzo.m.on { background: var(--turqs); border-color: var(--turq); color: #0E5F5B; font-weight: 700; }
.mq3.un .mzo { opacity: .85; }
@media (max-width: 900px) { .mq3 { grid-template-columns: 24px 1fr; } .mq3 .mzt { grid-column: 2; } .mq3 .mzs { grid-column: 1 / -1; gap: 2px; } .mzn { flex: 1 1 0; width: auto; min-width: 0; } }
.tq { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.tq p { margin: 0; font-size: 14px; line-height: 1.8; }
.topts { display: flex; gap: 4px; }
.mzn.topt { width: auto; color: var(--ink); padding: 0 10px; height: 32px; white-space: nowrap; }
.tq.un p { color: var(--ink); }
.tsub { margin-bottom: 12px; } .tsec { margin: 4px 0 6px; }
details.adv { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin: 6px 0; }
details.adv summary { cursor: pointer; }
details.adv ul { margin: 8px 0 4px; padding-right: 20px; line-height: 1.9; }
@media (max-width: 640px) { .tq { grid-template-columns: 1fr; } .topts { flex-wrap: wrap; } .mzn.topt { flex: 1 1 auto; } }
.supp-g { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.supp { text-align: right; font: inherit; border: 1.5px solid var(--line); background: #fff; border-radius: 14px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.supp.on { border-color: var(--turq); background: var(--turqs); }
.supp small { color: var(--muted); line-height: 1.7; }
.ev { font-size: 11px; font-weight: 700; border-radius: 99px; padding: 1px 8px; align-self: flex-start; }
.ev-a { background: #DDF4F2; color: #0E7F7A; } .ev-b { background: #FFF0D6; color: #A0620B; } .ev-c { background: #F3E8EC; color: #9B2C48; }
table.mic tr.off td { opacity: .45; }
.lvl { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 99px; padding: 1px 8px; margin-top: 3px; }
.lvl-req { background: #FCE8ED; color: #9B2C48; } .lvl-opt { background: #FFF0D6; color: #A0620B; } .lvl-info { background: #E9ECFB; color: #2D3C9A; }
.it.apx::after { content: '≈'; margin-inline-start: 5px; color: #C47A0E; font-weight: 800; }
.ic-btn { border: 0; background: var(--cream); border-radius: 8px; width: 30px; height: 30px; cursor: pointer; color: var(--lapis); }
.ic-btn:hover { background: var(--turqs); }
.totbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 6px 0 14px; }
.tb { font-size: 12px; color: var(--muted); }
.tb .bar { height: 7px; background: var(--line); border-radius: 9px; overflow: hidden; margin-top: 3px; }
.tb .bar i { display: block; height: 100%; border-radius: 9px; }
table.mic { width: 100%; border-collapse: collapse; font-size: 13px; }
table.mic td, table.mic th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; }
table.mic th { color: var(--muted); font-weight: 600; font-size: 12px; }
.pbar { height: 8px; background: var(--line); border-radius: 9px; overflow: hidden; min-width: 80px; }
.pbar i { display: block; height: 100%; border-radius: 9px; background: linear-gradient(90deg, var(--turq), var(--turq2)); }
.pbar i.lo { background: linear-gradient(90deg, var(--saff), #F6C26B); }

.pop { position: fixed; z-index: 50; background: #fff; border-radius: 14px; box-shadow: 0 16px 50px rgba(25, 29, 58, .25); width: 320px; max-height: 420px; overflow: auto; padding: 8px; }
.pop h4 { margin: 4px 8px 6px; font-size: 13px; color: var(--muted); }
.pop-list { max-height: 230px; overflow-y: auto; }
.pop button { display: flex; width: 100%; justify-content: space-between; border: 0; background: transparent; padding: 8px 10px; border-radius: 10px; cursor: pointer; text-align: right; font-size: 13.5px; }
.pop button:hover { background: var(--turqs); }
.pop button small { color: var(--muted); }
.pop-sec { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.pop-del-btn { display: flex !important; width: 100% !important; align-items: center !important; justify-content: center !important; gap: 6px !important; border: 1px solid #FECACA !important; background: #FEF2F2 !important; color: #DC2626 !important; padding: 7px 10px !important; border-radius: 8px !important; font-size: 12.5px !important; font-weight: 700 !important; cursor: pointer !important; transition: .15s !important; }
.pop-del-btn:hover { background: #FEE2E2 !important; border-color: #F87171 !important; }
.pop-avoid-btn { display: flex !important; width: 100% !important; align-items: center !important; justify-content: center !important; gap: 6px !important; border: 1px dashed #CBD5E1 !important; background: #F8FAFC !important; color: #64748B !important; padding: 6px 10px !important; border-radius: 8px !important; font-size: 11.5px !important; font-weight: 600 !important; cursor: pointer !important; transition: .15s !important; }
.pop-avoid-btn:hover { background: #F1F5F9 !important; color: #334155 !important; border-color: #94A3B8 !important; }

/* modal add food styles */
.af-search { width: 100%; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 14px; margin-bottom: 10px; background: #fff; box-sizing: border-box; }
.af-search:focus { outline: none; border-color: var(--turq); box-shadow: 0 0 0 3px rgba(14, 159, 154, 0.15); }
.af-quick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.af-quick-btn { font-size: 12px; background: #F1F5F9; border: 1px solid #E2E8F0; padding: 4px 9px; border-radius: 99px; cursor: pointer; transition: .12s; color: var(--ink); }
.af-quick-btn:hover { background: var(--turqs); border-color: var(--turq); color: var(--turq); font-weight: 700; }
.af-list { max-height: 200px; overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; background: #fff; }
.af-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid #F1F5F9; cursor: pointer; font-size: 13px; transition: .1s; }
.af-item:hover, .af-item.selected { background: var(--turqs); }
.af-item:last-child { border-bottom: none; }
.af-config { background: #F8FAFC; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
.af-config label { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
.af-gram-row { display: flex; align-items: center; gap: 8px; }
.af-gram-inp { width: 100px; padding: 6px 10px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 14px; font-weight: 700; text-align: center; }
.af-gram-inp:focus { outline: none; border-color: var(--turq); }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--lapis); color: #fff; padding: 10px 20px; border-radius: 999px; z-index: 60; box-shadow: var(--shadow); font-size: 14px; }
.mq { padding: 12px 0; border-bottom: 1px dashed var(--line); }
.mq p { margin: 0 0 8px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mq .mval { margin-right: auto; background: var(--lapis); color: #fff; border-radius: 999px; padding: 2px 12px; font-size: 13px; min-width: 34px; text-align: center; }
.mq.un .mval { background: #E7E3DA; color: var(--muted); font-weight: 400; }
.mtag { font-size: 11px; font-weight: 500; padding: 1px 8px; border-radius: 999px; }
.mtag.h { background: var(--pomes); color: var(--pome); }
.mtag.w { background: var(--turqs); color: var(--turq); }
.sl { display: grid; grid-template-columns: minmax(90px, 1fr) 3fr minmax(90px, 1fr); gap: 12px; align-items: center; }
.sl > span { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.sl > span:last-child { text-align: left; }
.sl > span small { display: block; font-weight: 700; color: var(--ink); }
.sl input[type=range] { width: 100%; accent-color: var(--plum); cursor: pointer; }
.mq.un .sl input[type=range] { opacity: .35; }
.mg { display: grid; grid-template-columns: 40px 1fr 40px 80px; gap: 10px; align-items: center; margin-top: 6px; font-size: 13px; }
.mg > span:nth-child(3) { text-align: left; }
.mg-b { position: relative; height: 10px; border-radius: 99px; background: linear-gradient(to left, #9FD8F5, #F3EFE6 50%, #F6B7A1); }
.mg-b i { position: absolute; top: -4px; width: 18px; height: 18px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); transform: translateX(50%); }
body.pt .wrap { grid-template-columns: 1fr; max-width: 980px; }
body.pt .side { display: none; }
.pt-hero h2 { font-size: 24px; }
.howto { margin: 0; padding-right: 20px; line-height: 2; color: var(--ink); }
.outs-g { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.out { font: inherit; text-align: right; border: 1.5px solid var(--line); background: #fff; border-radius: 16px; padding: 16px; cursor: pointer; display: grid; gap: 4px; transition: .15s; }
.out:hover { border-color: var(--turq); box-shadow: var(--shadow); transform: translateY(-1px); }
.out i { font-style: normal; font-size: 24px; }
.out b { color: var(--lapis); font-size: 15px; }
.out small { color: var(--muted); font-size: 12.5px; line-height: 1.7; }
@media (max-width: 640px) { .topbar-hide-sm { display: none; } .tbtn { padding: 7px 10px; font-size: 12.5px; } }
@media (max-width: 640px) { .sl { grid-template-columns: 1fr 1fr; } .sl input[type=range] { grid-column: 1 / -1; grid-row: 1; } }
.mres { background: linear-gradient(115deg, var(--lapis), var(--plum)); color: #fff; border-radius: 14px; padding: 16px; margin-top: 14px; }
.draft { display: inline-block; font-size: 11px; background: var(--saffs); color: #8A5A0C; border-radius: 6px; padding: 1px 8px; margin-right: 6px; vertical-align: middle; }

/* ---------- supplement brands modal ---------- */
.sb-modal { position: fixed; inset: 0; background: rgba(18, 22, 50, .82); z-index: 55; overflow-y: auto; display: none; padding: 20px 14px; backdrop-filter: blur(4px); }
.sb-modal.on { display: flex; justify-content: center; align-items: flex-start; }
.sb-modal-in { width: 100%; max-width: 980px; margin: auto; }
.sb-modal-content { background: var(--paper); border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, .4); padding: 24px; position: relative; }
.sbm-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; border-bottom: 1.5px solid var(--line); padding-bottom: 16px; flex-wrap: wrap; }
.brand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
@media (max-width: 640px) { .brand-grid { grid-template-columns: 1fr; } }
.brand-card { border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; background: #fff; display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: start; transition: .15s; }
.brand-card:hover { border-color: var(--turq); box-shadow: 0 6px 20px rgba(14, 159, 154, .12); }
.bc-visual { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; background: linear-gradient(180deg, #F8FAFC 0%, #F1F5F9 100%); border-radius: 14px; padding: 10px 8px; border: 1px solid var(--line); position: relative; }
.bc-img-container { width: 104px; height: 130px; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; border-radius: 10px; overflow: hidden; background: #ffffff; border: 1.5px solid #E2E8F0; padding: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
.bc-img-container:hover { transform: translateY(-2px); border-color: var(--turq); box-shadow: 0 8px 18px rgba(14, 159, 154, 0.2); }
.bc-img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.12)); transition: transform .2s ease; display: block; }
.bc-img-container:hover .bc-img { transform: scale(1.05); }
.bc-img-badge { position: absolute; top: 4px; right: 4px; background: rgba(14, 28, 64, 0.82); color: #fff; font-size: 8.5px; padding: 1px 5px; border-radius: 4px; font-weight: 700; pointer-events: none; }
.bc-img-overlay { position: absolute; inset: 0; background: rgba(18, 22, 50, 0.72); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .2s ease; border-radius: 8px; padding: 6px; text-align: center; }
.bc-img-container:hover .bc-img-overlay { opacity: 1; }
.bc-zoom-btn { color: #ffffff; font-size: 10px; font-weight: 800; line-height: 1.3; background: var(--turq); padding: 3px 6px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
.bc-upload-link { margin-top: 6px; font-size: 11px; font-weight: 700; color: var(--turq); background: none; border: 0; cursor: pointer; padding: 2px 6px; border-radius: 4px; text-decoration: underline; }
.bc-upload-link:hover { color: var(--lapis); background: #E6F7F5; }
.bc-rank { margin-top: 6px; font-size: 11px; font-weight: 800; background: var(--saffs); color: #8A5A0C; padding: 2px 8px; border-radius: 99px; text-align: center; }

/* Lightbox styles */
.lightbox-img-box { width: 100%; height: 260px; background: radial-gradient(circle, #ffffff 40%, #F1F5F9 100%); border-radius: 14px; border: 1.5px solid #E2E8F0; display: flex; align-items: center; justify-content: center; padding: 16px; margin: 16px 0; box-shadow: inset 0 2px 6px rgba(0,0,0,0.05); }
.lightbox-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.15)); }

.bc-info { min-width: 0; }
.bc-origin-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.bc-iran-tag { font-size: 11px; font-weight: 800; background: #DCFCE7; color: #15803D; padding: 2px 8px; border-radius: 6px; border: 1px solid #BBF7D0; }
.bc-global-tag { font-size: 11px; font-weight: 700; background: #F1F5F9; color: #475569; padding: 2px 7px; border-radius: 6px; }
.bc-store-tag { font-size: 10.5px; font-weight: 700; background: #FFFBEB; color: #92400E; padding: 2px 6px; border-radius: 6px; border: 1px solid #FDE68A; }
.bc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
.bc-title { margin: 0; font-size: 15px; color: var(--lapis); font-weight: 800; line-height: 1.35; }
.bc-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.bc-score-box { text-align: left; background: #FFFBEB; border: 1px solid #FDE68A; padding: 4px 8px; border-radius: 10px; flex: none; }
.bc-score { font-size: 16px; font-weight: 900; color: #B45309; display: block; line-height: 1; }
.bc-stars { font-size: 11px; color: #F59E0B; display: block; letter-spacing: 1px; }
.bc-badge { display: inline-block; font-size: 12px; font-weight: 700; color: #0E7F7A; background: var(--turqs); border-radius: 6px; padding: 2px 8px; margin: 4px 0 8px; }
.bc-meta { font-size: 12px; color: var(--ink); line-height: 1.6; display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
.bc-meta span b { color: var(--muted); }
.bc-certs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.bc-cert { font-size: 11px; background: #F1F5F9; color: #334155; border-radius: 6px; padding: 1px 7px; font-weight: 600; }
.bc-pros { font-size: 12px; color: #1E3A8A; line-height: 1.6; background: #EFF6FF; padding: 6px 10px; border-radius: 8px; margin-bottom: 6px; }
.bc-cons { font-size: 11.5px; color: #9B2C48; line-height: 1.5; background: #FFF1F2; padding: 5px 8px; border-radius: 8px; }
.sbm-footer { margin-top: 20px; padding: 14px 18px; border-radius: 14px; background: #FFF8E6; border: 1.5px solid #F6D9A5; font-size: 13px; color: #78350F; line-height: 1.8; }
.supp-brand-link { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--turq); background: var(--turqs); border-radius: 6px; padding: 2px 6px; margin-top: 4px; font-weight: 700; cursor: pointer; border: 0; }
.supp-brand-link:hover { background: #bfebe6; }

/* ---------- صفحه اختصاصی مقایسه برندها ---------- */
.cmp-container { display: flex; flex-direction: column; gap: 16px; margin-bottom: 30px; }
.cmp-hero { background: linear-gradient(135deg, #1C2766 0%, #151F52 50%, #2A1744 100%); color: #fff; border-radius: 18px; padding: 22px 24px; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(28, 39, 102, .25); }
.cmp-hero h2 { margin: 0 0 6px; font-size: 22px; font-weight: 900; color: #fff; }
.cmp-hero p { margin: 0; font-size: 13.5px; opacity: .88; line-height: 1.8; max-width: 820px; }
.cmp-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 16px; }
.cmp-kpi { background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .18); border-radius: 12px; padding: 10px 14px; backdrop-filter: blur(4px); }
.cmp-kpi b { display: block; font-size: 19px; font-weight: 800; color: #F6C26B; }
.cmp-kpi span { font-size: 11.5px; opacity: .85; }

/* Recommender Goal Cards */
.cmp-goals-head { font-size: 15px; font-weight: 800; color: var(--lapis); margin: 6px 0 10px; display: flex; align-items: center; justify-content: space-between; }
.cmp-recs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 8px; }
.cmp-rec-card { border: 1.5px solid var(--line); border-radius: 14px; background: #fff; padding: 14px 16px; cursor: pointer; transition: .18s; position: relative; text-align: right; }
.cmp-rec-card:hover { border-color: var(--turq); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(14, 159, 154, .12); }
.cmp-rec-card.active { border-color: var(--turq); background: #F0FDF4; box-shadow: 0 0 0 3px rgba(14, 159, 154, .2); }
.cmp-rec-h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.cmp-rec-h b { font-size: 13.5px; color: var(--lapis); }
.cmp-rec-sub { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 8px; }
.cmp-rec-picks { font-size: 11.5px; line-height: 1.6; background: #F8FAFC; border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; }
.cmp-rec-picks span { font-weight: 700; color: var(--turq); }
.cmp-rec-badge { font-size: 10.5px; font-weight: 700; background: #FEF3C7; color: #92400E; padding: 1px 6px; border-radius: 4px; display: inline-block; }

/* Filter Toolbar */
.cmp-toolbar { background: #fff; border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.cmp-search-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.cmp-search-inp { flex: 1; min-width: 220px; padding: 9px 14px; border: 1.5px solid var(--line); border-radius: 10px; font-size: 13.5px; }
.cmp-search-inp:focus { outline: none; border-color: var(--turq); }
.cmp-select { padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 10px; font-size: 13px; background: #fff; font-family: inherit; font-weight: 600; cursor: pointer; color: var(--ink); }
.cmp-select:focus { outline: none; border-color: var(--turq); }
.cmp-btn-view { border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 700; cursor: pointer; transition: .15s; }
.cmp-btn-view.on { background: var(--lapis); border-color: var(--lapis); color: #fff; }
.cmp-filter-chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.cmp-chip-lbl { font-size: 12px; font-weight: 700; color: var(--muted); margin-left: 4px; }

/* Interactive Comparison Table */
.cmp-tbl-box { background: #fff; border: 1.5px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.cmp-tbl-scroll { overflow-x: auto; max-width: 100%; }
.cmp-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: right; white-space: nowrap; }
.cmp-table th { background: #1C2766; color: #fff; padding: 11px 12px; font-size: 12.5px; font-weight: 700; position: sticky; top: 0; z-index: 2; user-select: none; }
.cmp-table th.sortable { cursor: pointer; }
.cmp-table th.sortable:hover { background: #2A398C; }
.cmp-table td { padding: 10px 12px; border-bottom: 1px solid #F1F5F9; vertical-align: middle; }
.cmp-table tr:hover td { background: #F8FAFC; }
.cmp-table tr.selected td { background: #E6F7F5; }
.cmp-prod-cell { display: flex; align-items: center; gap: 10px; text-align: right; }
.cmp-prod-img { width: 40px; height: 50px; object-fit: contain; border-radius: 6px; background: #fff; border: 1px solid #E2E8F0; padding: 2px; flex: none; cursor: pointer; }
.cmp-price-val { font-weight: 800; font-size: 13px; color: var(--lapis); }
.cmp-gram-val { font-weight: 900; font-size: 13px; color: #0E7F7A; background: #DCFCE7; padding: 2px 7px; border-radius: 6px; display: inline-block; }

/* Floating side-by-side compare bar */
.cmp-float-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1C2766; color: #fff; border-radius: 99px; padding: 8px 20px 8px 10px; display: flex; align-items: center; gap: 14px; z-index: 50; box-shadow: 0 12px 40px rgba(0, 0, 0, .4); animation: slideUp .2s ease; }
@keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.cmp-float-btn { background: var(--turq); color: #fff; border: none; padding: 8px 18px; border-radius: 99px; font-size: 13.5px; font-weight: 800; cursor: pointer; transition: .15s; }
.cmp-float-btn:hover { background: #138E8A; transform: scale(1.04); }

/* Side-by-side Modal Grid */
.side-compare-grid { display: grid; gap: 14px; overflow-x: auto; padding: 6px 0; }
.side-compare-col { border: 1.5px solid var(--line); border-radius: 14px; background: #fff; padding: 14px; min-width: 250px; display: flex; flex-direction: column; gap: 10px; }
.side-compare-col.highlight { border-color: var(--turq); box-shadow: 0 4px 16px rgba(14, 159, 154, .15); }

/* ---------- report preview ---------- */
#preview { position: fixed; inset: 0; background: rgba(20, 22, 45, .75); z-index: 40; overflow: auto; display: none; }
#preview.on { display: block; }
.pv-bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; justify-content: center; padding: 12px; background: rgba(20, 22, 45, .9); }
.pv-hint { color: #fff; font-size: 13px; opacity: .85; align-self: center; }
#report { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 20px 0 60px; }
/*@@REPORTCSS@@*/

@media print {
  @page { size: A4; margin: 0; }
  body { background: #fff; }
  body > *:not(#preview) { display: none !important; }
  #preview { position: static; display: block !important; background: none; overflow: visible; }
  .pv-bar { display: none; }
  #report { padding: 0; gap: 0; display: block; }
  .page { box-shadow: none !important; margin: 0 !important; }
}
</style>
</head>

<div id="suppBrandModal" class="sb-modal"><div class="sb-modal-in"><div class="sb-modal-content" id="suppBrandModalBody"></div></div></div>

<div id="addFoodModal" class="sb-modal" style="z-index:65"><div class="sb-modal-in" style="max-width:560px"><div class="sb-modal-content" id="addFoodModalBody"></div></div></div>
<div id="cmpCompareModal" class="sb-modal" style="z-index:70"><div class="sb-modal-in" style="max-width:1100px"><div class="sb-modal-content" id="cmpCompareModalBody"></div></div></div>
<div id="cmpDetailModal" class="sb-modal" style="z-index:75"><div class="sb-modal-in" style="max-width:760px"><div class="sb-modal-content" id="cmpDetailModalBody"></div></div></div>
<input type="file" id="fileIn" accept=".json,.html,application/json,text/html" style="display:none">
